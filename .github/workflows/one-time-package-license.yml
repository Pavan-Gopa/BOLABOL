name: One-time package license

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch release packaging
        shell: python
        run: |
          from pathlib import Path

          path = Path("Bolabol/script/build_release_dmg.sh")
          text = path.read_text()
          needle = '''for svg_name in BOLABOL_LOGO.svg BOLABOL_LOGO_Full.svg BOLABOL_Wordmark.svg BOLABOL_status_bar_icon.svg; do
            svg_src="$ROOT_DIR/Sources/NativeBolabol/Resources/Logos/$svg_name"
            if [[ -f "$svg_src" ]]; then
              cp "$svg_src" "$APP_LOGOS/$svg_name"
            fi
          done

          echo "=== Generating Info.plist ==="
          '''
          replacement = '''for svg_name in BOLABOL_LOGO.svg BOLABOL_LOGO_Full.svg BOLABOL_Wordmark.svg BOLABOL_status_bar_icon.svg; do
            svg_src="$ROOT_DIR/Sources/NativeBolabol/Resources/Logos/$svg_name"
            if [[ -f "$svg_src" ]]; then
              cp "$svg_src" "$APP_LOGOS/$svg_name"
            fi
          done

          # Ship the exact BOLABOL license inside the application bundle so
          # Settings > License can display the controlling legal text offline.
          LICENSE_SRC="$ROOT_DIR/Sources/NativeBolabol/Resources/BOLABOL_LICENSE.txt"
          if [[ -f "$LICENSE_SRC" ]]; then
            cp "$LICENSE_SRC" "$APP_RESOURCES/BOLABOL_LICENSE.txt"
          else
            echo "error: bundled BOLABOL license is missing: $LICENSE_SRC" >&2
            exit 1
          fi

          echo "=== Generating Info.plist ==="
          '''
          if needle not in text:
              raise SystemExit("Expected release-packaging block not found; refusing to patch")
          path.write_text(text.replace(needle, replacement, 1))

          workflow = Path(".github/workflows/one-time-package-license.yml")
          workflow.unlink()

      - name: Commit patch and remove one-time workflow
        run: |
          git config user.name "PAVEL KUZMIN"
          git config user.email "dhamamedia@gmail.com"
          git add Bolabol/script/build_release_dmg.sh .github/workflows/one-time-package-license.yml
          git commit -m "legal: package license text in release app bundle"
          git push
