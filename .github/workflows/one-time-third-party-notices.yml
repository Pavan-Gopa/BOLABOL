name: One-time third-party notices

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch release packaging
        shell: python
        run: |
          from pathlib import Path

          path = Path("Bolabol/script/build_release_dmg.sh")
          text = path.read_text()
          needle = '''if [[ -f "$LICENSE_SRC" ]]; then
            cp "$LICENSE_SRC" "$APP_RESOURCES/BOLABOL_LICENSE.txt"
          else
            echo "error: bundled BOLABOL license is missing: $LICENSE_SRC" >&2
            exit 1
          fi

          echo "=== Generating Info.plist ==="
          '''
          replacement = '''if [[ -f "$LICENSE_SRC" ]]; then
            cp "$LICENSE_SRC" "$APP_RESOURCES/BOLABOL_LICENSE.txt"
          else
            echo "error: bundled BOLABOL license is missing: $LICENSE_SRC" >&2
            exit 1
          fi

          # Preserve third-party license notices for every SwiftPM checkout that
          # participates in the build. This keeps binary redistribution notices
          # alongside the app without maintaining a fragile hand-written list.
          THIRD_PARTY_NOTICES="$APP_RESOURCES/THIRD_PARTY_NOTICES.txt"
          {
            echo "BOLABOL Third-Party Notices"
            echo "Generated from the Swift Package Manager checkouts used for this build."
            echo
            for checkout in "$ROOT_DIR/.build/checkouts"/*; do
              [[ -d "$checkout" ]] || continue
              project_name="$(basename "$checkout")"
              while IFS= read -r license_file; do
                [[ -n "$license_file" ]] || continue
                echo "===============================================================================" 
                echo "$project_name / $(basename "$license_file")"
                echo "===============================================================================" 
                cat "$license_file"
                echo
              done < <(find "$checkout" -maxdepth 1 -type f \
                \( -iname 'LICENSE' -o -iname 'LICENSE.*' -o -iname 'COPYING' -o -iname 'COPYING.*' \) \
                -print | sort)
            done
          } > "$THIRD_PARTY_NOTICES"

          echo "=== Generating Info.plist ==="
          '''
          if needle not in text:
              raise SystemExit("Expected bundled-license block not found; refusing to patch")
          path.write_text(text.replace(needle, replacement, 1))

          Path(".github/workflows/one-time-third-party-notices.yml").unlink()

      - name: Commit patch and remove one-time workflow
        run: |
          git config user.name "PAVEL KUZMIN"
          git config user.email "dhamamedia@gmail.com"
          git add Bolabol/script/build_release_dmg.sh .github/workflows/one-time-third-party-notices.yml
          git commit -m "legal: include third-party notices in release bundle"
          git push
