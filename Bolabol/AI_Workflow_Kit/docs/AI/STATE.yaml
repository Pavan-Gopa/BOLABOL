coder_brief: |
  Vertical Pulse only. Widen the top accessory/prompt region enough to render all
  five D/1/2/3/4 buttons centered with no clipping. Keep the main HUD capsule at an
  invariant screen anchor while raw/Variant 1/Variant 2, prompt row, language row,
