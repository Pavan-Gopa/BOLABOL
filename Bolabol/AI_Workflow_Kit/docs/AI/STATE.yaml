  Implement ADR-020's minimal S11 blocker scope: one immutable capability-aware
  session plan shared by hotkey, recording workflow, Sidebar, and audio-modal
  re-transcription. Canary Flash uses only supported configured primary/additional
  sources and HUD explicit fixed/switchable letters; Canary 1B exposes explicit
