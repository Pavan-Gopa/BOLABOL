  invent or alter a CDN endpoint without Human-approved configuration. Do not
  implement EN→FR, edit engines/EngineProtocols, script/qa, ranking, release,
  dependencies, or persisted fake state. Add ADR-020 mandatory focused tests,
  run full gates, real S9 smokes, and a fresh build; report live-CDN validation
  as blocked if the approved endpoint input remains absent.
