  recenter. Left click retains the existing compact language action. Right click
  on the left language glyph opens a complete localized menu from configured
  Settings languages and selects a target for Whisper-native or post-ASR text
  translation only. Auto-capable ASR remains auto; non-auto source uses Primary.
  Canary/GigaAM remain ADR-022 ASR-only. Preserve all other HUD styles.
