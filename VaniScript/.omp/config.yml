modelRoleStorage: project
modelRoles: 
  workflow_orchestrator: "@default"
  workflow_coder: openrouter/stealth/ox-alpha:max
  workflow_reviewer: openai-codex/gpt-5.6-luna:max
  workflow_tester: xai-oauth/grok-4.6:xhigh
  workflow_architect: openai-codex/gpt-5.6-sol:xhigh
  workflow_security: nvidia/z-ai/glm-5.2:max
  workflow_orchestrator_backup: google-antigravity/gemini-3.1-pro:high
  workflow_coder_backup: google-antigravity/gemini-3.6-flash:high
  workflow_reviewer_backup: openai-codex/gpt-5.6-sol:high
  workflow_tester_backup: google-antigravity/gemini-3.6-flash:high
  workflow_architect_backup: google-antigravity/claude-opus-4-6:high
  workflow_security_backup: openai-codex/gpt-5.6-sol:max
  default: openai-codex/gpt-5.6-sol:medium
retry: 
  enabled: true
  modelFallback: false
async: 
  enabled: true
task: 
  batch: true
  enableLsp: true
  maxConcurrency: 1
  maxRecursionDepth: 1
  maxRuntimeMs: 1800000
  softRequestBudget: 120
  showResolvedModelBadge: true
skills: 
  enabled: true
  enableSkillCommands: true
  customDirectories: 
    - "."
cycleOrder: 
  - workflow_orchestrator
  - workflow_orchestrator_backup
contextPromotion: 
  enabled: false
compaction: 
  enabled: false
  thresholdPercent: -1
  thresholdTokens: -1
  midTurnEnabled: false
  autoContinue: true
  idleEnabled: false
  asyncEnabled: false
  methodOrder: 
    - shake
    - soft
  supersedeReads: true
  dropUseless: true