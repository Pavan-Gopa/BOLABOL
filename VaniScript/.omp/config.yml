modelRoleStorage: project

modelRoles:
  workflow_orchestrator: openai-codex/gpt-5.6-sol:high
  workflow_coder: openai-codex/gpt-5.6-luna:max
  workflow_reviewer: google-antigravity/gemini-3.6-flash:high
  workflow_tester: openai-codex/gpt-5.6-terra:max
  workflow_architect: openai-codex/gpt-5.6-sol:max
  workflow_security: nvidia/z-ai/glm-5.2:max
  workflow_orchestrator_backup: xai-oauth/grok-4.5:high
  workflow_coder_backup: google-antigravity/gemini-3.6-flash:high
  workflow_reviewer_backup: openai-codex/gpt-5.6-sol:high
  workflow_tester_backup: google-antigravity/gemini-3.6-flash:high
  workflow_architect_backup: google-antigravity/claude-opus-4-6:high
  workflow_security_backup: openai-codex/gpt-5.6-sol:max

retry:
  enabled: true
  # Persistent model/provider failure pauses the workflow. Human authorizes backup.
  modelFallback: false

async:
  enabled: true

task:
  batch: true
  enableLsp: true
  maxConcurrency: 1
  maxRecursionDepth: 1
  maxRuntimeMs: 1800000
  softRequestBudget: 120
  showResolvedModelBadge: true

skills:
  enabled: true
  enableSkillCommands: true
  customDirectories:
    - .
