<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SmartScribe Overlay</title>
    <style>
      :root {
        --bg: rgba(18,18,18,0.6);
        --border: rgba(255,255,255,0.2);
        --glow: rgba(255, 59, 48, 0.6);
        --red: #ff3b30;
        --text: #f1f1f1;
      }
      html, body {
        margin: 0;
        padding: 0;
        background: transparent;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, Apple Color Emoji, Segoe UI Emoji;
      }
      .overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }
      .card {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 10px 14px;
        border-radius: 12px;
        background: var(--bg);
        border: 1px solid var(--border);
        box-shadow: 0 8px 24px rgba(0,0,0,0.35), 0 0 24px var(--glow) inset;
        backdrop-filter: blur(6px) saturate(120%);
      }
      .dot {
        width: 10px; height: 10px; border-radius: 50%; background: var(--red);
        box-shadow: 0 0 10px var(--glow), 0 0 18px var(--glow);
        animation: pulse 1.2s ease-in-out infinite;
      }
      .label { color: var(--text); font-size: 12px; opacity: 0.9; margin-right: 4px; }
      .bars { display: flex; gap: 4px; align-items: end; height: 28px; }
      .bar { width: 4px; background: var(--red); border-radius: 2px; box-shadow: 0 0 10px var(--glow); animation: wave 1.1s ease-in-out infinite; }
      .bar:nth-child(1){ height: 30%; animation-delay: 0s }
      .bar:nth-child(2){ height: 55%; animation-delay: .06s }
      .bar:nth-child(3){ height: 80%; animation-delay: .12s }
      .bar:nth-child(4){ height: 60%; animation-delay: .18s }
      .bar:nth-child(5){ height: 45%; animation-delay: .24s }
      .bar:nth-child(6){ height: 75%; animation-delay: .30s }
      .bar:nth-child(7){ height: 55%; animation-delay: .36s }
      .bar:nth-child(8){ height: 35%; animation-delay: .42s }

      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1 }
        50% { transform: scale(0.76); opacity: 0.85 }
      }
      @keyframes wave {
        0%, 100% { transform: scaleY(0.65) }
        50% { transform: scaleY(1.3) }
      }
    </style>
  </head>
  <body>
    <div class="overlay">
      <div class="card">
        <div class="dot" aria-hidden="true"></div>
        <div class="label">Listening…</div>
        <div class="bars" role="img" aria-label="Recording level">
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
        </div>
      </div>
    </div>
  </body>
  </html>
